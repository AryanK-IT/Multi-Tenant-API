global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "taskflow-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:3000"]
        labels:
          app: "taskflow"
          env: "production"

  - job_name: "taskflow-health"
    metrics_path: "/health"
    static_configs:
      - targets: ["api:3000"]

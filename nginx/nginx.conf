events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting zone for abusive IPs (fail-safe tier before Express)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream to TaskFlow API application instances
    upstream taskflow_backend {
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Max request body size matches SRS §5.1 / Express configuration
        client_max_body_size 1M;

        # Global security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gzip compression for JSON and documentation assets
        gzip on;
        gzip_types application/json text/plain text/css application/javascript application/xml;
        gzip_min_length 1024;

        # Proxy routing to TaskFlow API
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://taskflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }

        # Health & readiness probes bypass rate limiting
        location ~ ^/(health|ready)$ {
            proxy_pass http://taskflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}
